services:
  - type: web
    name: bugo-sync-list
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: LOG_LEVEL
        value: info
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_RESIDENT_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
